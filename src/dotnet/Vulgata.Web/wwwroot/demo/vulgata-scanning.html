<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulgata — 仓库扫描</title>
<style>
:root {
  --bg:        oklch(97% 0.005 70);
  --fg:        oklch(22% 0.025 250);
  --muted:     oklch(55% 0.015 250);
  --accent:    oklch(45% 0.14 255);
  --accent-2:  oklch(58% 0.16 200);
  --fx-bg:     oklch(97% 0.005 70);
  --text-glow: 0 1px 0 oklch(100% 0 0 / 0.7), 0 0 24px oklch(100% 0 0 / 0.5);
  --capsule-bg: oklch(100% 0 0 / 0.32);
  --capsule-border: oklch(100% 0 0 / 0.3);
  --capsule-shadow: 0 8px 32px oklch(0% 0 0 / 0.08);
  --tree-stroke: oklch(60% 0.1 255);
  --file-fg: oklch(30% 0.02 250);
  --file-border: oklch(0% 0 0 / 0.06);
}
html[data-theme="dark"] {
  --bg:        oklch(14% 0.012 250);
  --fg:        oklch(94% 0.005 250);
  --muted:     oklch(65% 0.015 250);
  --accent:    oklch(68% 0.16 200);
  --accent-2:  oklch(62% 0.18 255);
  --fx-bg:     oklch(10% 0.012 250);
  --text-glow: 0 1px 0 oklch(0% 0 0 / 0.6), 0 0 24px oklch(0% 0 0 / 0.8);
  --capsule-bg: oklch(20% 0.012 250 / 0.32);
  --capsule-border: oklch(100% 0 0 / 0.08);
  --capsule-shadow: 0 8px 32px oklch(0% 0 0 / 0.4), 0 0 60px oklch(68% 0.16 200 / 0.08);
  --tree-stroke: oklch(68% 0.16 200);
  --file-fg: oklch(80% 0.01 250);
  --file-border: oklch(100% 0 0 / 0.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  transition: background 2s cubic-bezier(0.4, 0, 0.2, 1), color 2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============ 全屏特效层 ============ */
.fx-layer {
  position: fixed; inset: 0; z-index: 0;
  background: var(--fx-bg);
  transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
/* 阶段3 强制深色背景，让发光效果凸显 */
.fx-layer.stage-dark {
  background: oklch(6% 0.012 250) !important;
}
/* 阶段3 自动切换文字为亮色（无论当前主题） */
body.stage-3-active .stage-label,
body.stage-3-active .stage-sub,
body.stage-3-active .progress-percent,
body.stage-3-active .progress-stage-num,
body.stage-3-active .brand-main,
body.stage-3-active .brand-sub,
body.stage-3-active .stage-step {
  color: oklch(94% 0.005 250);
  text-shadow: 0 1px 0 oklch(0% 0 0 / 0.6), 0 0 24px oklch(0% 0 0 / 0.8);
}
body.stage-3-active .stage-step.done { color: oklch(70% 0.01 250); }
body.stage-3-active .stage-step.active { color: oklch(85% 0.16 200); }
body.stage-3-active .progress-capsule {
  background: oklch(18% 0.012 250 / 0.32);
  border-color: oklch(100% 0 0 / 0.08);
  box-shadow: 0 8px 32px oklch(0% 0 0 / 0.4);
}
body.stage-3-active .progress-bar { background: oklch(100% 0 0 / 0.08); }
body.stage-3-active .stage-steps {
  background: oklch(18% 0.012 250 / 0.38);
  border-color: oklch(100% 0 0 / 0.08);
}
body.stage-3-active .brand-main {
  background: linear-gradient(135deg, oklch(94% 0.005 250), oklch(68% 0.16 200));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* ============ 内容悬浮层 ============ */
.content-layer {
  position: relative; z-index: 10;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 40px 56px;
}

/* 顶部栏 */
.top-bar {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand-main {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.12em; text-transform: uppercase;
  text-shadow: var(--text-glow);
}
.brand-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: brandPulse 2.2s ease-in-out infinite;
}
@keyframes brandPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
.brand-sub { font-size: 11px; color: var(--muted); opacity: 0.7; letter-spacing: 0.1em; text-shadow: var(--text-glow); }

.repo-info { text-align: right; display: flex; flex-direction: column; gap: 4px; }
.repo-name {
  font-size: 14px; color: var(--fg); font-weight: 500;
  text-shadow: var(--text-glow);
}
.repo-path { font-size: 11px; color: var(--muted); text-shadow: var(--text-glow); }

/* 中央舞台 */
.center-stage {
  align-self: end; justify-self: center;
  margin-bottom: 20px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  max-width: 720px;
  padding: 28px 40px;
  background: var(--capsule-bg);
  backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4);
  border: 1px solid var(--capsule-border);
  border-radius: 24px;
  box-shadow: var(--capsule-shadow);
  transition: background 2s, border-color 2s, box-shadow 2s;
}
.stage-label {
  font-size: clamp(28px, 4.5vw, 44px); font-weight: 600; letter-spacing: -0.02em;
  color: var(--fg);
  text-shadow: var(--text-glow);
  line-height: 1.1;
  min-height: 1.2em;
  transition: color 2s;
}
.stage-sub {
  font-size: 12px; color: var(--muted);
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  letter-spacing: 0.14em; text-transform: uppercase;
  text-shadow: var(--text-glow);
  min-height: 1.2em;
}

/* 进度胶囊 */
.progress-capsule {
  display: inline-flex; align-items: center; gap: 18px;
  padding: 14px 26px;
  background: oklch(100% 0 0 / 0.42);
  backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border: 1px solid oklch(100% 0 0 / 0.35);
  border-radius: 999px;
  box-shadow: 0 10px 40px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.1) inset;
  transition: background 2s, border-color 2s, box-shadow 2s;
}
html[data-theme="dark"] .progress-capsule {
  background: oklch(18% 0.012 250 / 0.42);
  border-color: oklch(100% 0 0 / 0.1);
  box-shadow: 0 10px 40px oklch(0% 0 0 / 0.5), 0 0 80px oklch(68% 0.16 200 / 0.1);
}
.progress-bar {
  width: 320px; height: 3px;
  background: oklch(0% 0 0 / 0.08);
  border-radius: 999px; overflow: hidden;
  position: relative;
}
html[data-theme="dark"] .progress-bar { background: oklch(100% 0 0 / 0.08); }
.progress-fill {
  position: absolute; top: 0; left: 0; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 999px;
  box-shadow: 0 0 14px var(--accent);
  transition: width 0.15s linear;
}
.progress-text {
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  font-size: 12px; color: var(--fg);
  letter-spacing: 0.1em;
  text-shadow: var(--text-glow);
  display: flex; align-items: center; gap: 10px;
  white-space: nowrap;
}
.progress-percent { font-weight: 600; font-size: 13px; min-width: 32px; text-align: right; }
.progress-stage-num { color: var(--muted); font-size: 11px; }

/* 底部阶段步骤 */
.stage-steps {
  justify-self: center;
  display: flex; gap: 48px; align-items: center;
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 14px 32px;
  background: oklch(100% 0 0 / 0.38);
  backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid oklch(100% 0 0 / 0.3);
  border-radius: 999px;
  box-shadow: 0 8px 32px oklch(0% 0 0 / 0.1), 0 0 0 1px oklch(100% 0 0 / 0.08) inset;
  transition: background 2s, border-color 2s, box-shadow 2s;
}
html[data-theme="dark"] .stage-steps {
  background: oklch(18% 0.012 250 / 0.38);
  border-color: oklch(100% 0 0 / 0.08);
  box-shadow: 0 8px 32px oklch(0% 0 0 / 0.45), 0 0 60px oklch(68% 0.16 200 / 0.08);
}
.stage-step {
  color: var(--muted);
  display: flex; align-items: center; gap: 10px;
  text-shadow: var(--text-glow);
  transition: color 0.5s;
  position: relative;
}
.stage-step::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); opacity: 0.5;
  transition: all 0.5s;
  flex-shrink: 0;
}
.stage-step.active { color: var(--fg); font-weight: 600; }
.stage-step.active::before {
  background: var(--accent); opacity: 1;
  box-shadow: 0 0 14px var(--accent);
  animation: stepPulse 1.8s ease-in-out infinite;
}
@keyframes stepPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 14px var(--accent); } 50% { transform: scale(1.3); box-shadow: 0 0 20px var(--accent); } }
.stage-step.done { color: var(--muted); }
.stage-step.done::before { background: var(--accent-2); opacity: 0.8; }

/* ============ 特效：阶段1 文件树（从顶到底展开） ============ */
.fx-tree {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 1s ease;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 10vh;
  overflow: hidden;
}
.fx-tree.active { opacity: 1; }
.tree-view {
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  font-size: 13px;
  line-height: 1.75;
  color: var(--fg);
  max-height: 82vh;
  overflow: hidden;
  padding: 0 16px;
}
.tree-item {
  display: flex; align-items: center; gap: 8px;
  padding: 1px 8px 1px 0;
  position: relative;
  opacity: 0;
  transform: translateY(-7px) scaleY(0.92);
  transform-origin: top left;
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
              color 0.35s;
  white-space: nowrap;
  text-shadow: var(--text-glow);
}
.tree-item.show {
  opacity: 1;
  transform: translateY(0) scaleY(1);
}
.tree-item.active-item { color: var(--accent); }
.tree-item.active-item .tree-name { text-shadow: var(--text-glow); }
.tree-item.active-item .tree-chevron { color: var(--accent); }
.tree-item.active-item .tree-icon { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.tree-chevron {
  width: 12px; height: 12px;
  display: inline-grid; place-items: center;
  flex-shrink: 0;
  color: var(--muted);
  font-size: 8px;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s;
}
.tree-chevron.open { transform: rotate(90deg); }
.tree-chevron.file-dot { visibility: hidden; }
.tree-icon {
  width: 14px; height: 14px; flex-shrink: 0;
  color: var(--muted);
  transition: color 0.3s, filter 0.3s;
}
.tree-icon svg { display: block; }
.tree-name { font-size: 12.5px; letter-spacing: 0.01em; }
.tree-children {
  position: relative;
  margin-left: 18px;
  padding-left: 14px;
  border-left: 1px solid oklch(60% 0.1 250 / 0.22);
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.tree-children.expanded { max-height: 3000px; }
html[data-theme="dark"] .tree-children { border-left-color: oklch(68% 0.16 200 / 0.25); }
.tree-item.settled { color: var(--fg); }
.tree-item.settled .tree-icon { color: var(--muted); filter: none; }
.tree-item.settled .tree-name { text-shadow: var(--text-glow); }

/* ============ 特效：阶段2 单列文件扫描 ============ */
.fx-files {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 1s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.fx-files.active { opacity: 1; }
.file-scan-column {
  position: relative;
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg);
  max-height: 78vh;
  width: min(560px, 82vw);
  overflow-y: scroll;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 28px 0;
  mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
}
.file-scan-column::-webkit-scrollbar { display: none; }
.file-scan-row {
  display: flex;
  gap: 10px;
  padding: 5px 20px;
  position: relative;
  color: var(--muted);
  opacity: 0.38;
  transition: opacity 0.45s, color 0.45s, background 0.45s, transform 0.45s;
  white-space: nowrap;
  text-shadow: var(--text-glow);
  border-radius: 4px;
}
.file-scan-row .file-path { color: var(--muted); opacity: 0.7; }
.file-scan-row .file-name { color: var(--fg); opacity: 0.85; font-weight: 500; }
.file-scan-row.scanning {
  opacity: 1;
  color: var(--accent);
  background: linear-gradient(90deg, oklch(58% 0.16 200 / 0.18), oklch(58% 0.16 200 / 0.06) 60%, transparent);
  transform: translateX(2px);
}
.file-scan-row.scanning .file-path,
.file-scan-row.scanning .file-name { color: var(--accent); opacity: 1; }
.file-scan-row.scanning::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  animation: scanBarPulse 0.9s ease-in-out infinite;
}
@keyframes scanBarPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
html[data-theme="dark"] .file-scan-row.scanning {
  background: linear-gradient(90deg, oklch(68% 0.16 200 / 0.22), oklch(68% 0.16 200 / 0.08) 60%, transparent);
}
.file-scan-row.scanned {
  opacity: 0.78;
  color: var(--fg);
}
.file-scan-row.scanned .file-name { color: var(--fg); opacity: 0.95; }
.file-scan-row.scanned::before { color: var(--accent-2); opacity: 0.6; }
.file-scan-row.scanned .file-path { color: var(--muted); opacity: 0.7; }

/* ============ 特效：阶段3 3D 图谱（Canvas） ============ */
.fx-graph {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 1s ease;
}
.fx-graph.active { opacity: 1; }
.fx-graph canvas { display: block; width: 100%; height: 100%; }

/* ============ 完成态 ============ */
.done-overlay {
  position: fixed; inset: 0; z-index: 30;
  display: none; place-items: center;
  background: var(--fx-bg);
  transition: background 2s;
}
.done-overlay.show { display: grid; animation: doneFade 1.2s ease both; }
@keyframes doneFade { from { opacity: 0; } to { opacity: 1; } }
.done-content {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  text-align: center;
  animation: doneRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
}
@keyframes doneRise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.done-check {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  box-shadow: 0 0 40px oklch(58% 0.16 200 / 0.5);
  animation: checkPop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
html[data-theme="dark"] .done-check { box-shadow: 0 0 60px oklch(68% 0.16 200 / 0.6); }
@keyframes checkPop { from { transform: scale(0) rotate(-45deg); } to { transform: scale(1) rotate(0); } }
.done-check svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2.5; }
.done-title {
  font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg);
  text-shadow: var(--text-glow);
}
.done-sub {
  font-size: 13px; color: var(--muted);
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  letter-spacing: 0.08em;
  text-shadow: var(--text-glow);
}

@media (max-width: 720px) {
  .content-layer { padding: 24px; }
  .stage-steps { gap: 24px; font-size: 10px; }
  .progress-bar { width: 200px; }
  .top-bar { font-size: 10px; }
}
</style>
</head>
<body>

<!-- 全屏特效背景 -->
<div class="fx-layer" id="fxLayer">
  <div class="fx-tree active" id="fxTree">
    <div class="tree-view" id="treeView"></div>
  </div>
  <div class="fx-files" id="fxFiles">
    <div class="file-scan-column" id="fileScanColumn"></div>
  </div>
  <div class="fx-graph" id="fxGraph">
    <canvas id="graphCanvas"></canvas>
  </div>
</div>

<!-- 悬浮信息层 -->
<div class="content-layer">
  <div class="top-bar">
    <div class="brand">
      <div class="brand-main"><span class="brand-dot"></span><span>Vulgata</span></div>
      <div class="brand-sub">Scanning repository</div>
    </div>
    
  </div>

  <div class="center-stage">
    <div class="stage-label" id="stageLabel">正在扫描仓库文件结构</div>
    <div class="stage-sub" id="stageSub">Analyzing repository layout…</div>
    <div class="progress-capsule">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text">
        <span class="progress-percent" id="progressPercent">0%</span>
        <span class="progress-stage-num" id="stageNum">· 1/3</span>
      </div>
    </div>
  </div>

  <div class="stage-steps" id="stageSteps">
    <div class="stage-step active" data-stage="0">结构扫描</div>
    <div class="stage-step" data-stage="1">读取代码</div>
    <div class="stage-step" data-stage="2">知识图谱</div>
  </div>
</div>

<!-- 完成态覆盖层 -->
<div class="done-overlay" id="doneOverlay">
  <div class="done-content">
    <div class="done-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
    <div class="done-title">扫描完成</div>
    <div class="done-sub">知识图谱已就绪，可以开始对话</div>
  </div>
</div>

<script>
(function () {
  var root = document.documentElement;
  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    root.setAttribute('data-theme', 'dark');
  }

  // ========= 阶段配置 =========
  var STAGES = [
    { id: 'tree',  duration: 15000, label: '正在扫描仓库文件结构', sub: 'Analyzing repository layout…' },
    { id: 'files', duration: 60000, label: '正在读取代码文件', sub: 'Reading source files…' },
    { id: 'graph', duration: 40000, label: '正在生成知识库文档', sub: 'Building knowledge graph…' }
  ];
  var TOTAL = STAGES.reduce(function (s, x) { return s + x.duration; }, 0);

  // ========= 阶段1: 文件树（从顶到底展开） =========
  var treeView = document.getElementById('treeView');
  var treeAnimQueue = []; // {el, chevron, childrenContainer, revealTime, expandTime, chevronRotateTime, settleTime, node}
  var treeStartTime = 0;
  var treeAnimId = null;

  var treeDef = {
    name: 'mbs_account', dir: true,
    children: [
      { name: 'src', dir: true, children: [
        { name: 'main/java/cn/com/yitong', dir: true, children: [
          { name: 'actions', dir: true, children: [
            { name: 'mobile', dir: true, children: [
              { name: 'UpdateChannelSessionOp.java', dir: false },
              { name: 'CreateAccountOp.java', dir: false },
              { name: 'QueryBalanceOp.java', dir: false }
            ]},
            { name: 'web', dir: true, children: [
              { name: 'TransferController.java', dir: false }
            ]}
          ]},
          { name: 'domain', dir: true, children: [
            { name: 'account', dir: true, children: [
              { name: 'Account.java', dir: false },
              { name: 'AccountRepository.java', dir: false },
              { name: 'Balance.java', dir: false }
            ]},
            { name: 'channel', dir: true, children: [
              { name: 'Channel.java', dir: false },
              { name: 'ChannelSession.java', dir: false }
            ]}
          ]},
          { name: 'services', dir: true, children: [
            { name: 'AccountService.java', dir: false },
            { name: 'ChannelService.java', dir: false },
            { name: 'SessionManager.java', dir: false },
            { name: 'impl', dir: true, children: [
              { name: 'AccountServiceImpl.java', dir: false },
              { name: 'ChannelServiceImpl.java', dir: false }
            ]}
          ]},

  function buildTree() {
    treeView.innerHTML = '';
    treeAnimQueue = [];

    var NODE_GAP = 280;      // ms between sibling reveals (base, before normalization)
    var FOLDER_PAUSE = 340;  // ms between folder appear and its expansion
    var CHEVRON_LEAD = 220;  // ms after folder appear before chevron rotates
    var SETTLE_LAG = 900;    // ms after last child appears before parent "settles"

    var timeCursor = { t: 200 };
    var parentStack = []; // track currently-open folders for settle calculation

    function walk(container, node) {
      var item = document.createElement('div');
      item.className = 'tree-item';
      var chevronClass = 'tree-chevron' + (node.dir ? '' : ' file-dot');
      item.innerHTML =
        '<span class="' + chevronClass + '">▶</span>' +
        '<span class="tree-icon">' + (node.dir ? FOLDER_SVG : FILE_SVG) + '</span>' +
        '<span class="tree-name">' + node.name + '</span>';
      container.appendChild(item);

      var entry = {
        el: item,
        chevron: item.querySelector('.tree-chevron'),
        icon: item.querySelector('.tree-icon'),
        node: node,
        childrenContainer: null,
        revealTime: timeCursor.t,
        expandTime: 0,
        chevronRotateTime: 0,
        settleTime: 0,
        lastChildIndex: -1
      };
      treeAnimQueue.push(entry);
      var myIndex = treeAnimQueue.length - 1;
      timeCursor.t += NODE_GAP;

      if (node.dir && node.children && node.children.length > 0) {
        var childContainer = document.createElement('div');
        childContainer.className = 'tree-children';
        container.appendChild(childContainer);
        entry.childrenContainer = childContainer;
        entry.chevronRotateTime = entry.revealTime + CHEVRON_LEAD;
        entry.expandTime = entry.revealTime + FOLDER_PAUSE;
        timeCursor.t = entry.expandTime + 120;

        parentStack.push(entry);
        node.children.forEach(function (child) { walk(childContainer, child); });
        var lastChildIdx = treeAnimQueue.length - 1;
        entry.lastChildIndex = lastChildIdx;
        entry.settleTime = treeAnimQueue[lastChildIdx].revealTime + SETTLE_LAG;
        parentStack.pop();
      }
    }

    walk(treeView, treeDef);

    // Normalize to fit within stage duration (leave 1.5s buffer at end for settling)
    var maxTime = 0;
    treeAnimQueue.forEach(function (e) {
      maxTime = Math.max(maxTime, e.revealTime, e.expandTime, e.settleTime);
    });
    var targetDuration = STAGES[0].duration - 1500;
    var scale = targetDuration / maxTime;
    treeAnimQueue.forEach(function (e) {
      e.revealTime *= scale;
      if (e.chevronRotateTime) e.chevronRotateTime *= scale;
      if (e.expandTime) e.expandTime *= scale;
      if (e.settleTime) e.settleTime *= scale;
    });
  }

  function startTree() {
    buildTree();

    function tick() {
      var elapsed = Date.now() - treeStartTime;
      var done = true;
      for (var i = 0; i < treeAnimQueue.length; i++) {
        var e = treeAnimQueue[i];
        if (elapsed >= e.revealTime && !e.el.classList.contains('show')) {
          e.el.classList.add('show', 'active-item');
        }
        if (e.chevronRotateTime && elapsed >= e.chevronRotateTime && !e.chevron.classList.contains('open')) {
          e.chevron.classList.add('open');
        }
        if (e.expandTime && elapsed >= e.expandTime && e.childrenContainer && !e.childrenContainer.classList.contains('expanded')) {
          e.childrenContainer.classList.add('expanded');
        }
        // Settle: once all children are shown and settle time reached, parent loses active highlight
        if (e.settleTime && elapsed >= e.settleTime && e.childrenContainer && !e.el.classList.contains('settled')) {
          e.el.classList.remove('active-item');
          e.el.classList.add('settled');
        }
        if (elapsed < (e.settleTime || e.revealTime) + 100) done = false;
      }
      if (!done) treeAnimId = requestAnimationFrame(tick);
    }
    tick();
  }

  // ========= 阶段3: 全屏 3D 知识图谱（优先连接拓扑）=========
  var canvas = document.getElementById('graphCanvas');
  var ctx = canvas.getContext('2d');
  var DPR = window.devicePixelRatio || 1;
  var nodes3D = [], edges3D = [];
  var rotY = 0, rotX = -0.18;
  var graphAnimId = null;
  var graphRevealStart = 0;
  var REVEAL_DURATION = STAGES[2].duration * 0.9;
  // 节点"呼吸"参数
  var breathPhase = [];
  // 漂移节点
  var driftNodes = [];
  // 脉冲波（显现完成后持续触发）
  var pulseWaves = [];
  var lastPulseTime = 0;

  function resizeCanvas() {
    var W = window.innerWidth, H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  function generateGraph() {
    nodes3D = []; edges3D = [];
    var W = window.innerWidth, H = window.innerHeight;
    // 范围：扩展到整个视口（在 3D 空间里用更大的坐标）
    var scaleX = Math.max(W, H) * 0.45;
    var scaleY = Math.max(W, H) * 0.36;
    var scaleZ = Math.max(W, H) * 0.28;

    // 优先连接 (Barabási–Albert) 生成拓扑
    var N = 16;
    var m0 = 4;
    var degrees = [];

    // 初始 m0 个节点互相连接
    for (var i = 0; i < m0; i++) {
      nodes3D.push(makeNode(i, N, scaleX, scaleY, scaleZ));
      degrees.push(0);
    }
    for (var i = 0; i < m0; i++) {
      for (var j = i + 1; j < m0; j++) {
        edges3D.push({ from: i, to: j, type: 'normal' });
        degrees[i]++; degrees[j]++;
      }
    }
    // 每个新节点连接 m = 2 个已有节点（优先连接）
    for (var i = m0; i < N; i++) {
      nodes3D.push(makeNode(i, N, scaleX, scaleY, scaleZ));
      degrees.push(0);
      var targets = preferentialAttach(degrees, 2, i);
      targets.forEach(function (t) {
        edges3D.push({ from: i, to: t, type: 'normal' });
        degrees[i]++; degrees[t]++;
      });
    }
    // 加一些长程边（跨画面连接，制造张力）
    var longEdgeCount = Math.floor(N * 0.2);
    for (var k = 0; k < longEdgeCount; k++) {
      var a = Math.floor(Math.random() * N);
      var b = Math.floor(Math.random() * N);
      if (a !== b) edges3D.push({ from: a, to: b, type: 'long' });
    }

    // hub 节点标记（度数 >= 4，节点少后阈值下调）
    nodes3D.forEach(function (n, i) {
      n.degree = degrees[i];
      n.isHub = degrees[i] >= 4;
    });

    // 呼吸相位
    breathPhase = nodes3D.map(function () { return Math.random() * Math.PI * 2; });
    // 漂移节点（35% 的节点缓慢漂移，制造持续的动态）
    driftNodes = [];
    for (var d = 0; d < Math.floor(N * 0.35); d++) {
      var idx = Math.floor(Math.random() * N);
      driftNodes.push({
        idx: idx,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.32,
        vz: (Math.random() - 0.5) * 0.25
      });
    }
  }

  function makeNode(i, N, scaleX, scaleY, scaleZ) {
    // 主体高斯分布 + 15% 离群点
    var isOutlier = Math.random() < 0.15;
    var x, y, z;
    if (isOutlier) {
      // 离群点：飞到画面边缘
      x = (Math.random() - 0.5) * scaleX * 2.2;
      y = (Math.random() - 0.5) * scaleY * 2.2;
      z = (Math.random() - 0.5) * scaleZ * 1.8;
    } else {
      x = gaussRand() * scaleX * 0.7;
      y = gaussRand() * scaleY * 0.65;
      z = gaussRand() * scaleZ * 0.7;
    }
    // hub 节点的初始度数会在后面赋值，这里先按位置给基础大小
    var baseR = 2 + Math.random() * 2;
    return {
      x: x, y: y, z: z,
      baseR: baseR,
      r: baseR,
      hue: 165 + Math.random() * 60, // 165° - 225°
      glowScale: 20 + Math.random() * 12 // 20r - 32r (更大更弥散的光场)
    };
  }

  function gaussRand() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function preferentialAttach(degrees, m, excludeIdx) {
    var targets = [];
    var total = degrees.reduce(function (s, d) { return s + d + 1; }, 0);
    var attempts = 0;
    while (targets.length < m && attempts < 50) {
      var r = Math.random() * total;
      var acc = 0;
      for (var i = 0; i < degrees.length; i++) {
        acc += degrees[i] + 1;
        if (r <= acc && i !== excludeIdx && targets.indexOf(i) < 0) {
          targets.push(i);
          break;
        }
      }
      attempts++;
    }
    return targets;
  }

  function updateDrift() {
    driftNodes.forEach(function (d) {
      var n = nodes3D[d.idx];
      n.x += d.vx; n.y += d.vy; n.z += d.vz;
      // 边界反弹
      var bound = 480;
      if (Math.abs(n.x) > bound) d.vx *= -1;
      if (Math.abs(n.y) > bound) d.vy *= -1;
      if (Math.abs(n.z) > bound * 0.7) d.vz *= -1;
    });
  }

  // 3D 旋转 + 透视投影
  function project(x, y, z) {
    var cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    var y1 = y * cosX - z * sinX;
    var z1 = y * sinX + z * cosX;
    var cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    var x1 = x * cosY + z1 * sinY;
    var z2 = -x * sinY + z1 * cosY;
    var focal = Math.max(window.innerWidth, window.innerHeight) * 1.1;
    // 近镜头裁剪：z2 接近或越过 -focal 时，scale 趋向 ±∞，
    // 节点会被渲染成填满整个屏幕的巨大光球（"镜头前无限放大"），
    // 甚至 scale 变负数导致 ctx.arc 抛 RangeError，rAF 链断掉（"卡住"）。
    // 用 0.85 留一些缓冲，让节点在接近镜头前平滑消失
    if (z2 < -focal * 0.85) return null;
    var scale = focal / (focal + z2);
    // 强制上限：避免近镜头节点渲染过大（正常 scale 在 0.3-2.5 之间）
    if (!isFinite(scale) || scale > 3.5) scale = 3.5;
    var w = canvas.width, h = canvas.height;
    return {
      sx: x1 * scale * DPR + w / 2,
      sy: y1 * scale * DPR + h / 2,
      scale: scale,
      z: z2
    };
  }

  function renderGraph() {
    try {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    var elapsed = Date.now() - graphRevealStart;
    var reveal = Math.min(1, elapsed / REVEAL_DURATION);
    var nodeRevealCount = Math.floor(reveal * nodes3D.length);
    var edgeRevealCount = Math.floor(reveal * edges3D.length);
    var time = Date.now() * 0.001;

    updateDrift();

    // 视角缓慢摆动：rotX 周期性变化让画面有呼吸感，不只是绕 Y 轴单调旋转
    rotX = -0.18 + Math.sin(time * 0.25) * 0.1;

    // 生成脉冲波（显现完成后每 1.5s 触发一个，持续有动感）
    if (reveal >= 1 && time - lastPulseTime > 1.5 && pulseWaves.length < 4) {
      var srcIdx = Math.floor(Math.random() * nodes3D.length);
      var srcNode = nodes3D[srcIdx];
      pulseWaves.push({
        x: srcNode.x, y: srcNode.y, z: srcNode.z,
        hue: srcNode.hue,
        startTime: time,
        duration: 3.5
      });
      lastPulseTime = time;
    }

    var projected = nodes3D.map(function (n) { return project(n.x, n.y, n.z); });
    var order = projected.map(function (_, i) { return i; });
    // project() 可能返回 null（节点在镜头背面被裁剪），sort 里要跳过
    order.sort(function (a, b) {
      var za = projected[a] ? projected[a].z : -1e9;
      var zb = projected[b] ? projected[b].z : -1e9;
      return za - zb;
    });

    // 画边
    ctx.lineCap = 'round';
    for (var ei = 0; ei < edgeRevealCount && ei < edges3D.length; ei++) {
      var e = edges3D[ei];
      var a = projected[e.from]; var b = projected[e.to];
      if (!a || !b) continue;
      var avgScale = (a.scale + b.scale) / 2;
      var isLong = e.type === 'long';
      var alpha = isLong ? 0.18 : 0.35;
      var lw = isLong ? 0.6 : 1.2;
      // 光晕层
      ctx.strokeStyle = 'hsla(' + nodes3D[e.from].hue + ', 85%, 65%, ' + (alpha * 0.4 * avgScale) + ')';
      ctx.lineWidth = (isLong ? 4 : 8) * DPR * avgScale;
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
      // 芯线
      ctx.strokeStyle = 'hsla(' + nodes3D[e.from].hue + ', 90%, 72%, ' + (alpha * avgScale) + ')';
      ctx.lineWidth = lw * DPR * avgScale;
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    }

    // 画节点（用 additive 混合 + 高斯模糊让多层光晕自然融合成柔光）
    var prevComposite = ctx.globalCompositeOperation;
    var prevFilter = ctx.filter;
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(1.5px)';
    for (var oi = 0; oi < order.length; oi++) {
      var i = order[oi];
      if (i >= nodeRevealCount) continue;
      var p = projected[i];
      if (!p) continue; // 被镜头裁剪掉的节点跳过
      var n = nodes3D[i];
      // 呼吸效果（频率提高让明暗变化更明显）
      var breath = Math.sin(time * 2.5 + breathPhase[i]) * 0.28 + 1;
      var r = n.baseR * p.scale * DPR * breath;
      // hub 节点放大（但整体保持柔和，不变成实心球）
      if (n.isHub) r *= 1.5;
      var glowR = r * n.glowScale * (n.isHub ? 1.25 : 1);
      // 外层大光晕 — 范围最大、alpha 最低，制造光的"场"（stops 更多，衰减更缓慢）
      var glow = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, glowR);
      glow.addColorStop(0,    'hsla(' + n.hue + ', 95%, 72%, ' + (0.22 * p.scale) + ')');
      glow.addColorStop(0.1,  'hsla(' + n.hue + ', 93%, 68%, ' + (0.16 * p.scale) + ')');
      glow.addColorStop(0.3,  'hsla(' + n.hue + ', 90%, 62%, ' + (0.08 * p.scale) + ')');
      glow.addColorStop(0.55, 'hsla(' + n.hue + ', 87%, 56%, ' + (0.03 * p.scale) + ')');
      glow.addColorStop(0.8,  'hsla(' + n.hue + ', 84%, 52%, ' + (0.008 * p.scale) + ')');
      glow.addColorStop(1,    'hsla(' + n.hue + ', 80%, 50%, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, glowR, 0, Math.PI * 2); ctx.fill();
      // 中层光晕 — 半径扩大到 r*9，让过渡更缓慢，避免边缘出现硬圆
      var mid = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 9);
      mid.addColorStop(0,   'hsla(' + n.hue + ', 100%, 88%, ' + (0.5 * p.scale) + ')');
      mid.addColorStop(0.2, 'hsla(' + n.hue + ', 97%, 78%, ' + (0.3 * p.scale) + ')');
      mid.addColorStop(0.45,'hsla(' + n.hue + ', 93%, 68%, ' + (0.12 * p.scale) + ')');
      mid.addColorStop(0.75,'hsla(' + n.hue + ', 89%, 60%, ' + (0.03 * p.scale) + ')');
      mid.addColorStop(1,   'hsla(' + n.hue + ', 85%, 55%, 0)');
      ctx.fillStyle = mid;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r * 9, 0, Math.PI * 2); ctx.fill();
      // 核心亮点 — 改为径向渐变（中心最亮、向外柔和衰减），不再是实心小球
      var core = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 0.55);
      core.addColorStop(0,   'hsla(' + n.hue + ', 100%, 98%, ' + (0.85 * p.scale) + ')');
      core.addColorStop(0.35,'hsla(' + n.hue + ', 100%, 92%, ' + (0.45 * p.scale) + ')');
      core.addColorStop(0.7, 'hsla(' + n.hue + ', 98%, 85%, ' + (0.12 * p.scale) + ')');
      core.addColorStop(1,   'hsla(' + n.hue + ', 95%, 78%, 0)');
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    ctx.filter = prevFilter;
    ctx.globalCompositeOperation = prevComposite;

    // 画脉冲波（在节点之上，制造扩散光圈效果）
    for (var pi = pulseWaves.length - 1; pi >= 0; pi--) {
      var pw = pulseWaves[pi];
      var age = time - pw.startTime;
      if (age > pw.duration) { pulseWaves.splice(pi, 1); continue; }
      var progress = age / pw.duration;
      // 投影脉冲波中心（project 可能返回 null — 节点在镜头背面）
      var pCenter = project(pw.x, pw.y, pw.z);
      if (!pCenter) { pulseWaves.splice(pi, 1); continue; }
      // 脉冲波半径：基于屏幕短边，不再乘以 pCenter.scale 避免近镜头爆表
      // 同时给 pCenter.scale 加个软上限用于半径缩放
      var pulseScale = Math.min(pCenter.scale, 2.5);
      var baseRadius = progress * Math.min(w, h) * 0.45;
      var alpha = (1 - progress) * (1 - progress) * 0.5; // 二次衰减，后段更柔和
      // 画扩散光圈（多层）
      for (var ring = 0; ring < 3; ring++) {
        var ringR = baseRadius * (0.7 + ring * 0.15) * pulseScale;
        var ringAlpha = alpha * (1 - ring * 0.3);
        ctx.strokeStyle = 'hsla(' + pw.hue + ', 90%, 70%, ' + ringAlpha + ')';
        ctx.lineWidth = (3 - ring) * DPR;
        ctx.beginPath();
        ctx.arc(pCenter.sx, pCenter.sy, ringR, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    rotY += 0.006;
    } catch (err) {
      // 防止渲染异常导致 rAF 链断掉（"卡住"）
      console.error('[stage3 render]', err);
    }
    graphAnimId = requestAnimationFrame(renderGraph);
  }

  function startGraphRender() {
    resizeCanvas();
    generateGraph();
    graphRevealStart = Date.now();
    pulseWaves = [];
    lastPulseTime = 0;
    if (graphAnimId) cancelAnimationFrame(graphAnimId);
    renderGraph();
  }
  function stopGraphRender() {
    if (graphAnimId) { cancelAnimationFrame(graphAnimId); graphAnimId = null; }
  }

  // ========= 阶段控制器 =========
  var progressFill = document.getElementById('progressFill');
  var progressPercent = document.getElementById('progressPercent');
  var stageNum = document.getElementById('stageNum');
  var stageLabel = document.getElementById('stageLabel');
  var stageSub = document.getElementById('stageSub');
  var fxTree = document.getElementById('fxTree');
  var fxGraph = document.getElementById('fxGraph');
  var fxLayer = document.getElementById('fxLayer');
  var stageSteps = document.querySelectorAll('.stage-step');
  var doneOverlay = document.getElementById('doneOverlay');

  var stageStarts = [];
  var cum = 0;
  STAGES.forEach(function (s) { stageStarts.push(cum); cum += s.duration; });

  var startTime = Date.now();
  var currentStage = -1;
  var stageStartTime = startTime;

  function setStage(i) {
    if (i === currentStage) return;
    currentStage = i;
    stageStartTime = Date.now();
    var s = STAGES[i];
    stageLabel.textContent = s.label;
    stageSub.textContent = s.sub;
    stageNum.textContent = '· ' + (i + 1) + '/' + STAGES.length;

    fxTree.classList.toggle('active', s.id === 'tree');
    fxFiles.classList.toggle('active', s.id === 'files');
    fxGraph.classList.toggle('active', s.id === 'graph');
    // 阶段3 强制深色背景以凸显发光效果
    fxLayer.classList.toggle('stage-dark', s.id === 'graph');
    document.body.classList.toggle('stage-3-active', s.id === 'graph');

    if (s.id === 'tree') startTree(); else stopTree();
    if (s.id === 'files') startReading(); else stopReading();
    if (s.id === 'graph') startGraphRender(); else stopGraphRender();

    // 更新底部步骤
    stageSteps.forEach(function (el, idx) {
      el.classList.remove('active', 'done');
      if (idx < i) el.classList.add('done');
      else if (idx === i) el.classList.add('active');
    });
  }

  function tick() {
    var elapsed = Date.now() - startTime;
    var stageElapsed = Date.now() - stageStartTime;
    var stageDuration = STAGES[currentStage] ? STAGES[currentStage].duration : 1;
    var pct = Math.min(100, (stageElapsed / stageDuration) * 100);
    progressFill.style.width = pct + '%';
    progressPercent.textContent = Math.floor(pct) + '%';

    var stageIdx = 0;
    for (var i = STAGES.length - 1; i >= 0; i--) {
      if (elapsed >= stageStarts[i]) { stageIdx = i; break; }
    }
    setStage(stageIdx);

    if (elapsed >= TOTAL) {
      progressFill.style.width = '100%';
      progressPercent.textContent = '100%';
      doneOverlay.classList.add('show');
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('resize', function () {
    buildTree();
    buildFiles();
    if (currentStage === 0) startTree();
    if (currentStage === 2) resizeCanvas();
  });
})();
</script>

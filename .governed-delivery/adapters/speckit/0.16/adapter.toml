schema_version = "1.0"
id = "speckit-0.16"
capability = "definition"
version = ">=0.16,<0.17"

required_skills = [
  "speckit-specify",
  "speckit-plan",
  "speckit-tasks",
  "speckit-analyze",
  "speckit-converge",
]

required_files = [
  ".specify/init-options.json",
  ".specify/memory/constitution.md",
  ".specify/scripts/powershell/check-prerequisites.ps1",
  ".specify/scripts/powershell/create-new-feature.ps1",
  ".specify/scripts/powershell/setup-plan.ps1",
  ".specify/scripts/powershell/setup-tasks.ps1",
  ".specify/templates/spec-template.md",
  ".specify/templates/plan-template.md",
  ".specify/templates/tasks-template.md",
]

[upstream]
verified_version = "0.16.4"
version_source = "json-key"
version_path = ".specify/init-options.json"
version_key = "speckit_version"
version_prefix = "0.16."

[skill_markers]
speckit-specify = ["SPECIFY_FEATURE_DIRECTORY"]
speckit-plan = ["SPECS_DIR"]
speckit-tasks = ["TASKS_TEMPLATE_CONTENT"]
speckit-analyze = ["STRICTLY READ-ONLY"]
speckit-converge = ["tasks_appended"]

[outputs]
feature_directory = "SPECS_DIR"

[implementation]
provider = "governed-tdd"
converge_after_provider = true

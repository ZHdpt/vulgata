schema_version = "1.0"

[lifecycle]
adapter = "bmad-6.12"

[definition]
adapter = "speckit-1.0.6"

[construction]
skill = "governed-tdd"

[architecture_review]
adapter = "bmad-review-codebase-design"
enabled = true

[paths]
feature_root = "specs"
repository_instructions = "AGENTS.md"
constitution = ".specify/memory/constitution.md"
sprint_status = "docs/bmad/implementation-artifacts/sprint-status.yaml"
epics = "docs/bmad/epics.md"
implementation_artifacts = "docs/bmad/implementation-artifacts"
project_lessons = "docs/project-lessons.md"

[commands]
build = "dotnet build src/dotnet/Vulgata.Web/Vulgata.Web.csproj"
test = "dotnet test tests/Vulgata.Tests/Vulgata.Tests.csproj"
